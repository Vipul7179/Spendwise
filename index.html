.fl input:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent);outline:none}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:none;color:var(--mut);cursor:pointer;border-radius:50%;display:grid;place-items:center}.eye svg{width:18px;height:18px}.eye:hover{color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.pws{display:flex;gap:6px;align-items:center;margin-top:2px}.pws i{flex:1;height:5px;border-radius:5px;background:var(--line);transition:background .25s}.pws span{font-size:.75rem;color:var(--mut);min-width:48px;text-align:right}
.pws[data-s="1"] i:nth-child(-n+1){background:var(--bad)}.pws[data-s="2"] i:nth-child(-n+2){background:var(--warn)}.pws[data-s="3"] i:nth-child(-n+3){background:#7bc043}.pws[data-s="4"] i{background:var(--ok)}
.cta{position:relative;overflow:hidden;background:linear-gradient(135deg,#4b3fd6,#7a5af8)!important;box-shadow:0 12px 26px -10px rgba(75,63,214,.85);transition:transform .15s,box-shadow .2s}.cta:hover{transform:translateY(-2px)}.cta:disabled{opacity:.85;cursor:wait}
.cta::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.5s infinite}

.mb{height:7px;border-radius:9px;background:rgba(255,255,255,.25);margin-top:8px;overflow:hidden}.mb i{display:block;height:100%;width:62%;background:#c6f24e;border-radius:9px;animation:grow 1.6s .6s both}
@media (min-width:900px){.aw{flex-direction:row;height:100%}.ah{flex:1.1;display:flex;flex-direction:column;justify-content:center;padding:48px 56px}.ap{flex:1;align-items:center;margin:0;padding:32px;overflow:auto}.ap .ab{background:none;border:0;box-shadow:none;padding:0}.fcs{display:block;position:relative;height:260px;margin-top:36px}}
@media (prefers-reduced-motion:reduce){.bl,.fc,.cta::after,.mb i,#af>*,.ab,.abrand,.ht,.hp2,.auth.closing,.sp{animation:none!important}.tabs .ind,#rot{transition:none}}

 nav{position:sticky;top:24px;align-self:start;flex-direction:column;justify-content:flex-start;gap:4px;border:0;background:none;padding:0;height:fit-content}

}

  <main><div id="view"></div><footer class="ft"><div class="card sup"><div><b>Enjoying Spendwise?</b><div class="mut">Support the developer with a small coffee. Every bit helps keep it free.</div></div><button class="b" onclick="supportM()">Buy me a coffee</button></div><div class="cred">Designed and developed by <b>Vipul Singh</b><div class="soc"><a href="https://www.instagram.com/thevipulshow" target="_blank" rel="noopener noreferrer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.4A4 4 0 1 1 12.6 8 4 4 0 0 1 16 11.4z"/><path d="M17.5 6.5h.01"/></svg>Instagram</a><a href="https://www.linkedin.com/in/vipul-singh-46792a1a4" target="_blank" rel="noopener noreferrer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>LinkedIn</a></div><div>&copy; 2026 Spendwise. Your data stays on your device.</div></div></footer></main>
</div>
<div class="toast" id="toast" hidden></div>
<div class="splash" id="splash"><div><div class="logo"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#4b3fd6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.2 15.9A10 10 0 1 1 8 2.8"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg></div><h1>Spendwise</h1><p>Track. Budget. Save.</p></div></div>
<div id="modal"></div>
<div id="auth" class="auth" hidden></div>
<button class="fab" id="fab" onclick="fabGo()" aria-label="Add expense">+</button>
<script>
const KEY='spendwise_v1',PAL=['#4b3fd6','#ff6b5b','#19b394','#f5b301','#2f8cff','#e0529c','#8a5cf6','#7ba11a'];
const I=p=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const TABS=[['home','Overview',I('<path d="M21.2 15.9A10 10 0 1 1 8 2.8"/><path d="M22 12A10 10 0 0 0 12 2v10z"/>')],['bud','Budgets',I('<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>')],['rec','Automate',I('<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>')],['sav','Savings',I('<path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>')],['grp','Groups',I('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>')],['alr','Alerts',I('<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>')]];
const KW={Food:['swiggy','zomato','restaurant','cafe','dominos','mcdonald','bigbasket','blinkit','zepto','grocery','kitchen'],Transport:['uber','ola','rapido','irctc','metro','petrol','fuel','hpcl','bpcl','indian oil','fastag'],Bills:['electric','bescom','recharge','airtel','jio','vodafone','broadband','insurance','lic','gas','netflix','hotstar','emi','rent'],Shopping:['amazon','flipkart','myntra','ajio','meesho','mall']};
let S,tab='home',tt,ROWS=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtR=p=>'₹'+(p/100).toLocaleString('en-IN',{maximumFractionDigits:2});let FORCE=0;const fmt=p=>!(S&&S.hide===true)||FORCE?fmtR(p):'₹ ••••';
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const mk=s=>s.slice(0,7),uid=()=>Math.random().toString(36).slice(2,9),NOW=()=>ymd(new Date());
const paise=v=>Math.round(parseFloat(v)*100)||0;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
 if(!S)S={cats:[['Food',6000],['Transport',2000],['Bills',5000],['Shopping',3000]].map(c=>({id:uid(),name:c[0],limit:c[1]*100})),exps:[],rec:[],goals:[],alerts:[],fired:{},phone:'',chan:'wa'}}
function burst(){for(let i=0;i<34;i++){const s=document.createElement('span');s.className='cf';s.style.left=Math.random()*100+'vw';s.style.background=PAL[i%8];s.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2600)}}
const cat=id=>S.cats.find(c=>c.id===id),ci=id=>Math.max(0,S.cats.findIndex(c=>c.id===id));
const spent=(id,m)=>S.exps.filter(e=>e.cat===id&&mk(e.date)===m).reduce((a,e)=>a+e.amt,0);
const mTotal=m=>S.exps.filter(e=>mk(e.date)===m).reduce((a,e)=>a+e.amt,0);
const col=p=>p>=100?'var(--bad)':p>=50?'var(--warn)':'var(--ok)';
function checkAlerts(id,date){const c=cat(id),m=mk(date);if(!c||!c.limit)return;const pct=spent(id,m)/c.limit*100;
 [50,80,100].forEach(th=>{const k=m+'|'+id+'|'+th;if(pct>=th&&!S.fired[k]){S.fired[k]=1;
  const msg=th>=100?`⚠️ Over budget! ${c.name} spending is ${fmt(spent(id,m))} of your ${fmt(c.limit)} limit.`:`Heads up: you've used ${th}% of your ${c.name} budget (${fmt(spent(id,m))} of ${fmt(c.limit)}).`;
  S.alerts.unshift({id:uid(),t:new Date().toLocaleString('en-IN'),msg});toast(msg)}})}
function addExp(o){S.exps.push({id:uid(),...o});checkAlerts(o.cat,o.date)}
function runRec(){const d=new Date(),m=mk(NOW()),dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
 S.rec.forEach(r=>{const day=Math.min(r.day,dim);if(r.last!==m&&d.getDate()>=day){addExp({date:m+'-'+String(day).padStart(2,'0'),amt:r.amt,cat:r.cat,note:r.name+' (auto)'});r.last=m}})}
function link(msg){const n=S.phone.replace(/\D/g,'');if(!n)return null;return S.chan==='wa'?`https://wa.me/${n}?text=${encodeURIComponent(msg)}`:`sms:+${n}?body=${encodeURIComponent(msg)}`}
const opts=()=>S.cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');

function donutC(m){
 ROWS=S.cats.map((c,i)=>({n:c.name,v:spent(c.id,m),c:PAL[i%8]})).filter(r=>r.v>0);
 const tot=ROWS.reduce((a,r)=>a+r.v,0);let off=0;
 const segs=tot?ROWS.map((r,i)=>{const p=r.v/tot*100,l=Math.max(p-.8,.2);const s=`<circle class="seg" tabindex="0" role="img" aria-label="${esc(r.n)} ${Math.round(p)}%" r="15.9155" cx="21" cy="21" fill="none" stroke="${r.c}" stroke-width="6" stroke-dasharray="${l} ${100-l}" stroke-dashoffset="${-off}" onclick="pick(${i})" onkeydown="if(event.key==='Enter')pick(${i})"/>`;off+=p;return s}).join(''):'';
 return `<div class="donut"><svg viewBox="0 0 42 42"><circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--line)" stroke-width="6"/><g transform="rotate(-90 21 21)">${segs}</g></svg>
 <div class="ctr"><span class="mut" id="dl">${tot?'Total spent':'No spending yet'}</span><b id="dv">${fmt(tot)}</b><span class="mut" id="dp"></span></div></div>
 <div class="legend">${ROWS.map((r,i)=>`<button onclick="pick(${i})"><span class="dot" style="background:${r.c}"></span>${esc(r.n)}</button>`).join('')}</div>`}
function pick(i){const tot=ROWS.reduce((a,r)=>a+r.v,0),r=ROWS[i];$('#dl').textContent=r.n;$('#dv').textContent=fmt(r.v);$('#dp').textContent=Math.round(r.v/tot*100)+'% of spending';
 document.querySelectorAll('.seg').forEach((s,j)=>{s.style.opacity=j===i?1:.35;s.setAttribute('stroke-width',(+s.dataset.w||6)+(j===i?1:0))})}
function ring(p,c){return `<div class="ring"><svg viewBox="0 0 42 42"><circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--line)" stroke-width="5"/><circle r="15.9155" cx="21" cy="21" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${p} ${100-p}" transform="rotate(-90 21 21)"/></svg><b>${Math.round(p)}%</b></div>`}

function vHomeOld(){
 const m=VM,h=new Date().getHours(),tot=mTotal(m),lim=S.cats.reduce((a,c)=>a+c.limit,0),saved=S.goals.reduce((a,g)=>a+g.saved,0);
 const top=S.cats.map(c=>({n:c.name,v:spent(c.id,m)})).sort((a,b)=>b.v-a.v)[0];
 const list=S.exps.filter(e=>VDay?e.date===VDay:mk(e.date)===m).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,VDay?100:15),dayTot=VDay?S.exps.filter(e=>e.date===VDay).reduce((a,e)=>a+e.amt,0):0;
 return `<div class="hero"><div class="hi">${h<12?'Good morning':h<18?'Good afternoon':'Good evening'}${S.name?', <b>'+esc(S.name)+'</b>':''}<button class="edit" onclick="nameM()">Edit name</button><br>Total spent in ${mlab(m)}</div><div class="big" id="bt" data-v="${tot}">${fmt(tot)}</div>
 <div class="pills"><span class="pill">${lim?Math.round(tot/lim*100):0}% of ${fmt(lim)} budget</span><span class="pill l">Saved ${fmt(saved)}</span>${VDay?`<span class="pill">${VDay}: ${fmt(dayTot)}</span>`:''}${top&&top.v?`<span class="pill">Top: ${esc(top.n)}</span>`:''}</div></div>
 ${repBanner()}${dbar()}<div class="grid two"><div class="card"><h2>Spending overview</h2>${donut(m)}</div>
 <div class="grid" style="align-content:start"><div class="card"><h2>Add expense</h2><div class="row"><input id="ea" type="number" min="0" step="0.01" placeholder="Amount ₹" inputmode="decimal"><select id="ec">${opts()}</select><input id="ed" type="date" value="${NOW()}"><input id="en" placeholder="Note (optional)"><button class="b" onclick="doAdd()">Add expense</button></div></div>
 <div class="card"><h2>Budget progress</h2>${S.cats.map(c=>{const s=spent(c.id,m),p=c.limit?s/c.limit*100:0;return `<div class="li" style="border:0;padding:5px 0;display:block"><div class="row" style="justify-content:space-between"><span>${esc(c.name)}</span><span class="mut">${fmt(s)} / ${fmt(c.limit)}</span></div><div class="bar"><i style="width:${Math.min(p,100)}%;background:${col(p)}"></i></div></div>`}).join('')||'<div class="empty">Add a category in Budgets.</div>'}</div></div></div>
 <div class="card" style="margin-top:14px"><h2>${VDay?'Expenses on '+VDay:'Expenses in '+mlab(m)}</h2>${list.map(e=>`<div class="li"><div class="row" style="flex-wrap:nowrap"><div class="ic" style="background:${PAL[ci(e.cat)%8]}">${esc((cat(e.cat)?.name||'?')[0].toUpperCase())}</div><div>${esc(e.note||cat(e.cat)?.name||'Expense')}<div class="mut">${e.date} <span class="tag">${esc(cat(e.cat)?.name||'?')}</span></div></div></div><div class="row" style="flex-wrap:nowrap"><span class="amt">${fmt(e.amt)}</span><button class="g" onclick="delExp('${e.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No expenses for this period.</div>'}</div>`}
function vBud(){const m=mk(NOW());
 return `<div class="card" style="margin-bottom:14px"><h2>New category</h2><div class="row"><input id="cn" placeholder="Name (e.g. Medicine)"><input id="cl" type="number" min="0" placeholder="Monthly limit ₹" inputmode="decimal"><button class="b" onclick="addCat()">Add category</button></div><div class="note">Alerts fire at 50%, 80% and 100% of each limit.</div></div>
 <div class="card"><h2>Your budgets</h2>${S.cats.map((c,i)=>{const s=spent(c.id,m),p=c.limit?s/c.limit*100:0;return `<div class="li"><div style="flex:1;min-width:0"><span class="dot" style="background:${PAL[i%8]}"></span> <b>${esc(c.name)}</b> <span class="mut">${Math.round(p)}% used</span><div class="bar"><i style="width:${Math.min(p,100)}%;background:${col(p)}"></i></div></div><div class="row" style="flex-wrap:nowrap"><input style="width:96px;flex:0 0 96px" ${S.hide===true?'type="text" disabled value="••••" title="Show amounts to edit"':'type="number" value="'+c.limit/100+'"'} onchange="setLim('${c.id}',this.value)" aria-label="Limit for ${esc(c.name)}"><button class="g" onclick="delCat('${c.id}')">Delete</button></div></div>`}).join('')||'<div class="empty">No categories yet.</div>'}</div>`}
function vRec(){return `<div class="card" style="margin-bottom:14px"><h2>Auto-deduct a recurring expense</h2><div class="row"><input id="rn" placeholder="Name (e.g. Rent)"><input id="ra" type="number" min="0" placeholder="Amount ₹" inputmode="decimal"><select id="rc">${opts()}</select><select id="rd" aria-label="Day of month"><option value="" selected disabled>Day of month</option>${Array.from({length:31},(_,i)=>i+1).map(n=>`<option value="${n}">${ordn(n)} of every month</option>`).join('')}</select><button class="b" onclick="addRec()">Add recurring</button></div><div class="note">It is logged automatically each month on that day (on the last day of shorter months). This records the spend; to move real money, use UPI AutoPay or a bank standing instruction.</div></div>
 <div class="card"><h2>Active</h2>${S.rec.map(r=>`<div class="li"><div>${esc(r.name)}<div class="mut">Day ${r.day} every month <span class="tag">${esc(cat(r.cat)?.name||'?')}</span></div></div><div class="row" style="flex-wrap:nowrap"><span class="amt">${fmt(r.amt)}</span><button class="g" onclick="delRec('${r.id}')">Stop</button></div></div>`).join('')||'<div class="empty">Nothing scheduled yet.</div>'}</div>`}
function vSav(){return `<div class="card" style="margin-bottom:14px"><h2>New saving goal</h2><div class="row"><input id="gn" placeholder="Goal (e.g. New phone)"><input id="gt" type="number" min="1" placeholder="Target ₹" inputmode="decimal"><button class="b" onclick="addGoal()">Create goal</button></div></div>
 <div class="grid two">${S.goals.map(g=>{const p=Math.min(100,g.saved/g.target*100);return `<div class="card"><div class="goal">${ring(p,p>=100?'var(--ok)':'var(--acc)')}<div><b>${esc(g.name)}</b><div class="mut">${fmt(g.saved)} of ${fmt(g.target)}</div><div class="mut">${p>=100?'Goal reached':fmt(g.target-g.saved)+' to go'}</div></div></div>
 <div class="row" style="margin-top:12px"><input id="g_${g.id}" type="number" min="0" placeholder="Amount ₹" inputmode="decimal"><button class="b" onclick="addSaved('${g.id}')">Add savings</button><button class="g" onclick="delGoal('${g.id}')">Delete</button></div></div>`}).join('')||'<div class="card empty">No goals yet. Set a target above and start saving.</div>'}</div>`}

function delExp(id){S.exps=S.exps.filter(e=>e.id!==id);save();render()}

function pDate(s){let m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=s.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);if(!m)return NOW();const y=m[3].length==2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}

function parseSms(t){if(/credited|received|deposited|refund/i.test(t)&&!/debited|spent|paid/i.test(t))return 'credit';
 const a=t.match(/(?:rs\.?|inr|₹)\s*([\d,]+(?:\.\d{1,2})?)/i);if(!a||!/debit|spent|paid|sent|purchase|withdrawn|payment/i.test(t))return null;
 const m=t.match(/(?:\bat\b|\bto\b|\bfor\b)\s+([A-Za-z0-9&.@_ -]{2,40})/i);
 const mer=m?m[1].split(/\s(?:on|via|ref|upi|avl|bal|from|using)\b/i)[0].replace(/[.\s-]+$/,'').trim():'';
 return {amt:paise(a[1].replace(/,/g,'')),mer:mer||'Bank debit',date:pDate(t)}}
function importCsv(f){if(!f)return;const r=new FileReader();r.onload=()=>{const R=String(r.result).split(/\r?\n/).filter(Boolean).map(l=>{const o=[];let c='',q=0;for(const ch of l){if(ch==='"')q=!q;else if(ch===','&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o});
 const h=R.findIndex(x=>x.some(v=>/date/i.test(v)));if(h<0)return toast('No header row with a Date column found.');
 const H=R[h],di=H.findIndex(v=>/date/i.test(v)),ni=H.findIndex(v=>/desc|narr|particular|remark/i.test(v)),ai=H.findIndex(v=>/debit|withdraw|amount/i.test(v));
 if(ai<0)return toast('No Debit or Amount column found.');let n=0;
 R.slice(h+1).forEach(x=>{const amt=paise((x[ai]||'').replace(/[^\d.]/g,''));if(amt>0)n+=addParsed({amt,mer:(x[ni]||'Bank debit').trim().slice(0,40),date:pDate(x[di]||'')},x[ni]||'')});

function supportM(){modal(`<div class="nm"><h2>Buy me a coffee</h2><p class="mut">Spendwise is free to use. If it helps you, you can support its development with any amount.</p><img class="qr" src="${QR}" alt="UPI QR code to support the developer"><span class="mut">Scan with any UPI app</span><div class="upi"><span class="mut">or pay to this UPI ID</span><div class="upirow"><code>${UPI}</code><button class="g" onclick="copyUpi()" aria-label="Copy UPI ID">Copy</button></div></div><button class="g" onclick="closeM()">Close</button></div>`)}
const G=()=>(S.groups||[]).find(g=>g.id===S.gid);
function gShares(e){const k=e.with.length,b=Math.floor(e.amt/k),r=e.amt-b*k,o={};e.with.forEach(m=>o[m]=b);o[e.with.includes(e.payer)?e.payer:e.with[0]]+=r;return o}
function gDues(g){const o=[];g.exps.forEach(e=>{const sh=gShares(e);e.with.forEach(m=>{if(m!==e.payer&&sh[m]>0)o.push({id:e.id,from:m,to:e.payer,amt:sh[m],desc:e.desc,date:e.date,done:!!(e.paid&&e.paid[m])})})});return o}
function gNet(g){const n=g.members.map(()=>0);gDues(g).forEach(d=>{if(!d.done){n[d.to]+=d.amt;n[d.from]-=d.amt}});return n}
function gShare(g){const N='\n',p={};gDues(g).filter(d=>!d.done).forEach(d=>{const k=d.from+'-'+d.to;p[k]=(p[k]||0)+d.amt});const L=Object.keys(p).map(k=>{const x=k.split('-');return g.members[x[0]]+' owes '+g.members[x[1]]+' '+fmt(p[k])});return 'https://wa.me/?text='+encodeURIComponent('Spendwise - '+g.name+N+(L.join(N)||'All settled up')+N+'Total group spend: '+fmt(g.exps.reduce((a,e)=>a+e.amt,0)))}
