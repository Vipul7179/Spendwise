<style>
:root{--bg:#f2f8f4;--card:#fff;--ink:#0d2a21;--mut:#5a7a6e;--acc:#0f7a58;--onacc:#fff;--lime:#fbd24d;--warn:#e29a00;--bad:#e5483a;--ok:#14a37f;--line:#d8e9df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06140f;--card:#0e2219;--ink:#e6f4ec;--mut:#8db3a2;--acc:#3fd9a0;--onacc:#04251a;--line:#1c3a2d;--ok:#3fd1a8;--warn:#f5b301;--bad:#ff7a6b}}
:root[data-theme="dark"]{--bg:#06140f;--card:#0e2219;--ink:#e6f4ec;--mut:#8db3a2;--acc:#3fd9a0;--onacc:#04251a;--line:#1c3a2d;--ok:#3fd1a8;--warn:#f5b301;--bad:#ff7a6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.45}
.app{max-width:1100px;margin:0 auto;padding:14px 14px 96px}
main{min-width:0}
.brand{font-weight:800;font-size:1.4rem;letter-spacing:-.03em;display:none;margin-bottom:18px}
.brand b{color:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:.7rem;padding:6px 2px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:1.25rem}
nav button.on{color:var(--acc);font-weight:600;background:color-mix(in srgb,var(--acc) 12%,transparent)}
.hero{border-radius:22px;padding:22px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#27c08a 0%,transparent 55%),linear-gradient(135deg,#06382a,#0f7a58);margin-bottom:14px;position:relative;overflow:hidden}
.hero .hi{opacity:.8;font-size:.9rem}
.hero .big{font-size:clamp(2.2rem,8vw,3.4rem);font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:4px 0 12px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.16);border-radius:99px;padding:6px 12px;font-size:.82rem}
.pill.l{background:#fff;color:#06382a;font-weight:600}
.grid{display:grid;gap:14px}
.card{background:var(--card);border-radius:16px;padding:18px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(6,40,30,.05),0 8px 24px -12px rgba(6,40,30,.12)}
textarea{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);resize:vertical}
.st{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.m3{display:grid;gap:10px;margin-top:6px}.m3 div{padding:10px 12px;border:1px solid var(--line);border-radius:12px}.m3 b{display:block}
h2{font-size:1.05rem;margin:0 0 12px;font-weight:600}
.mut{color:var(--mut);font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);min-width:0;flex:1 1 130px}
.b{font:inherit;background:var(--acc);color:var(--onacc);border:0;padding:11px 18px;border-radius:12px;cursor:pointer;font-weight:600;flex:1 1 auto}
.b:active{transform:scale(.97)}
.g{font:inherit;background:none;border:1px solid var(--line);color:var(--ink);padding:5px 10px;border-radius:9px;cursor:pointer;font-size:.8rem;text-decoration:none}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,.seg:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.donut{position:relative;width:min(100%,250px);margin:0 auto}
.donut svg{display:block;width:100%}
.seg{cursor:pointer;transition:opacity .2s,stroke-width .2s;outline:none}
.ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.ctr b{font-size:1.5rem;letter-spacing:-.03em}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:14px}
.legend button{background:none;border:0;color:var(--ink);font:inherit;font-size:.82rem;cursor:pointer;display:flex;align-items:center;gap:6px;padding:2px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;border-radius:9px;transition:width .5s}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.li:first-of-type{border-top:0}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.amt{font-weight:600;white-space:nowrap}
.tag{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--mut)}
.goal{display:flex;gap:14px;align-items:center}
.ring{width:84px;flex:none;position:relative}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.95rem}
.note{font-size:.8rem;color:var(--mut);margin-top:10px}
.empty{color:var(--mut);padding:10px 0;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;max-width:92%;z-index:9;box-shadow:0 8px 28px rgba(0,0,0,.3);animation:up .25s}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}
.cf{position:fixed;top:-14px;width:8px;height:13px;z-index:20;animation:fall 1.9s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.cf{display:none}.toast{animation:none}.bar i{transition:none}}
.splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:linear-gradient(135deg,#06382a,#0f7a58);color:#fff;transition:opacity .5s,visibility .5s}
.splash.out{opacity:0;visibility:hidden}
.splash div{text-align:center}
.logo{width:76px;height:76px;margin:0 auto 14px;border-radius:22px;background:#fff;display:grid;place-items:center;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
.splash h1{font-size:2rem;margin:0;font-weight:800;letter-spacing:-.03em;animation:rise .6s .25s both}
.splash p{margin:6px 0 0;opacity:.75;animation:rise .6s .45s both}
@keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes fade{from{opacity:0}}
@keyframes pop2{from{opacity:0;transform:translateY(16px) scale(.95)}}
@keyframes grow{from{width:0}}

function readAppRoute(){
  const hash=(location.hash||'').replace(/^#/,''),normalized=hash.toLowerCase();
  if(normalized==='login') return {type:'auth',mode:'in'};
  if(normalized==='signup') return {type:'auth',mode:'up'};
  if(normalized==='blog'||normalized==='blog/') return {type:'blog',slug:null};
  if(normalized.startsWith('blog/')){
    let slug=hash.slice(5);
    try{slug=decodeURIComponent(slug)}catch(e){}
    return {type:'blog',slug:slug||null};
  }
  return {type:'app',tab:ROUTE_TABS[normalized]||'home',unknown:!!hash&&!ROUTE_TABS[normalized]};

function safeBlogImage(value){
  if(!value || typeof value !== 'string') return '';
  const trimmed=value.trim();
  if(!trimmed) return '';
  try{
    const url=new URL(trimmed);
    return url.protocol === 'https:' ? url.href : '';
  }catch(e){
    return '';
  }
}
function formatBlogDate(value, includeTime){
  if(!value) return '';
  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return '';
  const options = { day: 'numeric', month: 'short', year: 'numeric' };
  if(includeTime){ options.hour = 'numeric'; options.minute = '2-digit'; options.hour12 = true; }
  return new Intl.DateTimeFormat(undefined, options).format(date);
}
function formatRelativeTime(value){
  if(!value) return '';
  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return '';
  const diffSec = Math.floor((Date.now() - date.getTime()) / 1000);
  if(diffSec < 60) return 'just now';
  if(diffSec < 3600){ const m = Math.floor(diffSec / 60); return `${m} min${m===1?'':'s'} ago`; }
  if(diffSec < 86400){ const h = Math.floor(diffSec / 3600); return `${h} hour${h===1?'':'s'} ago`; }
  if(diffSec < 86400 * 30){ const d = Math.floor(diffSec / 86400); return `${d} day${d===1?'':'s'} ago`; }
  if(diffSec < 86400 * 365){ const mo = Math.floor(diffSec / (86400 * 30)); return `${mo} month${mo===1?'':'s'} ago`; }
  const y = Math.floor(diffSec / (86400 * 365));
  return `${y} year${y===1?'':'s'} ago`;
}
function isSignificantlyUpdated(pubDate, upDate){
  if(!pubDate || !upDate) return false;
  const p = new Date(pubDate).getTime(), u = new Date(upDate).getTime();
  if(Number.isNaN(p) || Number.isNaN(u)) return false;
  return (u - p) > (15 * 60 * 1000);
}
function blogTimestampMeta(post){
  if(!post) return { pubDate: '', pubTime: '', isUpdated: false, upDate: '', upTime: '', upRelative: '', cardLabel: 'Recently published', cardTitle: '' };
  const pubDate = formatBlogDate(post.published_at);
  const pubTime = formatBlogDate(post.published_at, true);
  const isUpdated = isSignificantlyUpdated(post.published_at, post.updated_at);
  const upDate = isUpdated ? formatBlogDate(post.updated_at) : '';
  const upTime = isUpdated ? formatBlogDate(post.updated_at, true) : '';
  const upRelative = isUpdated ? formatRelativeTime(post.updated_at) : '';
  const cardLabel = pubDate ? (isUpdated ? `${pubDate} (updated ${upRelative})` : pubDate) : (upDate ? `Updated ${upDate}` : 'Recently published');
  const cardTitle = pubTime ? `Published: ${pubTime}${isUpdated ? ' · Updated: ' + upTime : ''}` : '';
  return { pubDate, pubTime, isUpdated, upDate, upTime, upRelative, cardLabel, cardTitle };
}

function stripUnsafeTags(rawHtml){
  const fallback = '<p>There is no content for this article yet.</p>';
  if(!rawHtml || !String(rawHtml).trim()) return fallback;
  if(window.DOMPurify && typeof window.DOMPurify.sanitize==='function'){
    const clean=window.DOMPurify.sanitize(String(rawHtml),{
      ALLOWED_TAGS:['A','P','BR','STRONG','B','EM','I','U','S','DEL','UL','OL','LI','BLOCKQUOTE','H1','H2','H3','H4','H5','H6','PRE','CODE','IMG','FIGURE','FIGCAPTION','HR','TABLE','THEAD','TBODY','TFOOT','TR','TH','TD','SPAN','DIV','SUB','SUP','MARK'],
      ALLOWED_ATTR:['href','src','alt','title','colspan','rowspan','scope','align']
    });
    const doc=new DOMParser().parseFromString(clean,'text/html');
    doc.querySelectorAll('img').forEach(image=>{
      const src=image.getAttribute('src');
      if(!safeBlogImage(src)){image.remove();return;}
      if(!image.getAttribute('alt'))image.setAttribute('alt','Blog image');
    });
    doc.querySelectorAll('table').forEach(table=>{
      if(table.parentElement?.classList.contains('table-wrap'))return;
      const wrapper=doc.createElement('div');
      wrapper.className='table-wrap';
      table.replaceWith(wrapper);
      wrapper.appendChild(table);
    });
    return doc.body.innerHTML||fallback;
  }
  const doc=new DOMParser().parseFromString(String(rawHtml), 'text/html');
  const allowed = new Set(['A','P','BR','STRONG','B','EM','I','UL','OL','LI','BLOCKQUOTE','H1','H2','H3','H4','H5','H6','PRE','CODE','IMG','FIGURE','FIGCAPTION','HR','TABLE','THEAD','TBODY','TR','TH','TD','SPAN','DIV','STRIKE','SUB','SUP','MARK']);
  doc.querySelectorAll('script,style,iframe,object,embed,svg,video,source,canvas,link').forEach(el=>el.remove());
  const walker=document.createTreeWalker(doc.body, NodeFilter.SHOW_ELEMENT, null);
  const nodes=[];
  while(walker.nextNode()){ nodes.push(walker.currentNode); }
  nodes.forEach(node=>{
    if(!allowed.has(node.tagName)){
      const fragment=document.createDocumentFragment();
      while(node.firstChild){ fragment.appendChild(node.firstChild); }
      node.replaceWith(fragment);
      return;
    }
    for(const attr of [...node.attributes]){
      const name=attr.name.toLowerCase();
      if(name.startsWith('on')){ node.removeAttribute(attr.name); continue; }
      if(name==='style' || name==='class' || name==='id'){ node.removeAttribute(attr.name); continue; }
      if(name==='href' || name==='src'){ 
        const value=String(attr.value||'').trim();
        if(!value){ node.removeAttribute(attr.name); continue; }
        const url=new URL(value, location.origin);
        if((name==='href' && !['http:','https:','mailto:'].includes(url.protocol)) || (name==='src' && !['http:','https:'].includes(url.protocol))){
          node.removeAttribute(attr.name);
        }
      }
    }
    if(node.tagName==='IMG'){
      const src=node.getAttribute('src');
      const alt=node.getAttribute('alt') || '';
      if(!safeBlogImage(src)){ node.remove(); }
      else if(!alt){ node.setAttribute('alt', 'Blog image'); }
    }
  });
  return doc.body.innerHTML || fallback;
}
function renderBlogContent(markdown){
  const source=String(markdown||'').trim();
  if(!source)return stripUnsafeTags('<p>There is no content for this article yet.</p>');
  try{
    const html=window.marked&&typeof window.marked.parse==='function'
      ? window.marked.parse(source,{gfm:true,breaks:false})
      : `<p>${esc(source).replace(/\r?\n/g,'<br>')}</p>`;
    return stripUnsafeTags(html);
  }catch(error){
    console.warn('[Blog] Markdown rendering failed; showing escaped text',error);
    return stripUnsafeTags(`<p>${esc(source).replace(/\r?\n/g,'<br>')}</p>`);
  }
}

async function bootstrapBlogList(reset=true){

    const start = (BLOG_STATE.page - 1) * BLOG_PAGE_SIZE;

    const response=await blogRest('blog_posts',params);
    const fetched=Array.isArray(response)?response:[];
    const items=fetched.slice(0,BLOG_PAGE_SIZE);
    if(reset){ BLOG_STATE.posts = items; } else { BLOG_STATE.posts = BLOG_STATE.posts.concat(items); }
    BLOG_STATE.hasMore = fetched.length > BLOG_PAGE_SIZE;
    BLOG_STATE.total = BLOG_STATE.posts.length + (BLOG_STATE.hasMore ? 1 : 0);
  }catch(error){

    BLOG_STATE.errorKind = 'network';

      <time datetime="${esc(article.published_at || '')}" title="${esc(ts.pubTime ? 'Published: ' + ts.pubTime : '')}">${esc(ts.pubTime || 'Recently published')}</time>
      ${ts.isUpdated ? `<span>•</span><span title="Last updated: ${esc(ts.upTime)}" style="color:var(--acc);font-weight:600">Updated ${esc(ts.upRelative)}</span>` : ''}
    </div>
    <h1>${esc(article.title)}</h1>
    ${article.excerpt ? `<p class="mut" style="margin:0; font-size:1rem; line-height:1.6;">${esc(article.excerpt)}</p>` : ''}
    <article class="story">${content}</article>
    ${relatedMarkup}
  </div>`;
}
async function loadBlogArticle(slug){
  if(!slug || !blogConfigured()){
    BLOG_STATE.articleLoading = false;
    BLOG_STATE.articleError = 'The Hisbo Journal is getting ready. Please check back soon.';
    render(1);
    return;
  }
  BLOG_STATE.articleLoading = true;
  BLOG_STATE.articleError = '';
  BLOG_STATE.article = null;
  BLOG_STATE.relatedPosts = [];
  render(1);
  try{
    const now = new Date().toISOString();
    const params=blogPublishedParams(now);
    params.set('slug','eq.'+slug);
    params.set('limit','1');
    const articleRows=await blogRest('blog_posts',params);
    const data=Array.isArray(articleRows)?articleRows[0]:null;
    if(!data){
      BLOG_STATE.articleLoading = false;
      BLOG_STATE.articleError = 'This article is not available right now.';
      BLOG_STATE.article = null;
      render(1);
      return;
    }
    const categoryId = data.category_id;
    const relatedParams=blogPublishedParams(now);
    relatedParams.set('id','neq.'+data.id);
    relatedParams.set('order','published_at.desc');
    relatedParams.set('limit','3');
    if(categoryId){ relatedParams.set('category_id','eq.'+categoryId); }
    let related=[];
    try{
      const response=await blogRest('blog_posts',relatedParams);
      related=Array.isArray(response)?response:[];
    }catch(error){
      console.warn('[Blog] related public.blog_posts request failed', error);
    }
    BLOG_STATE.article = data;
    BLOG_STATE.relatedPosts = related;
    if (data.seo_title || data.seo_description || data.og_image_url || data.noindex) {
      applyBlogMeta(data);
    } else {
      clearBlogMeta();
    }
  }catch(error){
    console.error('[Blog] article load failed', error);
    BLOG_STATE.articleError = 'This article is not available or could not be loaded.';
    BLOG_STATE.article = null;
    clearBlogMeta();
  }
  BLOG_STATE.articleLoading = false;
  render(1);
}
function applyBlogMeta(article){
  const targetTitle = article.seo_title || article.title || 'Hisbo Blog';
  const targetDescription = article.seo_description || article.excerpt || 'Read the latest Hisbo stories and insights.';
  const ogImage = safeBlogImage(article.og_image_url || article.cover_image_url) || 'https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=1200&q=80';
  const titleNode=document.querySelector('title');
  if(titleNode){ titleNode.textContent = targetTitle; }
  const metaDescription=document.querySelector('meta[name="description"]');
  if(metaDescription){ metaDescription.setAttribute('content', targetDescription); }
  let ogTitle=document.querySelector('meta[property="og:title"]');
  if(!ogTitle){ ogTitle=document.createElement('meta'); ogTitle.setAttribute('property','og:title'); document.head.appendChild(ogTitle); }
  ogTitle.setAttribute('content', targetTitle);
  let ogDescription=document.querySelector('meta[property="og:description"]');
  if(!ogDescription){ ogDescription=document.createElement('meta'); ogDescription.setAttribute('property','og:description'); document.head.appendChild(ogDescription); }
  ogDescription.setAttribute('content', targetDescription);
  let ogImageNode=document.querySelector('meta[property="og:image"]');
  if(!ogImageNode){ ogImageNode=document.createElement('meta'); ogImageNode.setAttribute('property','og:image'); document.head.appendChild(ogImageNode); }
  ogImageNode.setAttribute('content', ogImage);
  let robots=document.querySelector('meta[name="robots"]');
  if(!robots){ robots=document.createElement('meta'); robots.setAttribute('name','robots'); document.head.appendChild(robots); }
  robots.setAttribute('content', article.noindex ? 'noindex, nofollow' : 'index, follow');
}
function clearBlogMeta(){
  document.title = 'Hisbo';
  const description=document.querySelector('meta[name="description"]');
  if(description){ description.setAttribute('content', 'Hisbo helps you track spending, budgets, goals, and shared expenses in one place.'); }
  const robots=document.querySelector('meta[name="robots"]');
  if(robots){ robots.setAttribute('content', 'index, follow'); }
}
